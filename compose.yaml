services:
  atlas:
    build: .
    image: atlas-forex-replay:1.0.0
    container_name: atlas-forex-replay
    restart: unless-stopped
    ports: ["${ATLAS_PORT:-8080}:8080"]
    environment: {NODE_ENV: production, PORT: "8080", DATA_DIR: /data}
    volumes: ["atlas_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  atlas_data: {name: atlas_forex_replay_data}
